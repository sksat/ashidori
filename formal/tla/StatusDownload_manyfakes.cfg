\* The code with the rotation: more made-up rows newer than the genuine status
\* of one device (3) than candidates kept per device (MaxCand = 2 here, 4 in
\* the app). Rows that fall out come back on a rescan below the rows not tried
\* yet, so the genuine status is read.
CONSTANTS
  Devs = {1, 2}
  Self = 1
  MaxRows = 1
  Limit = 1
  MaxNetErr = 0
  Hostile = TRUE
  Fakes = {"s2", "t2", "u2"}
  BigSeq = 9
  BigCursor = 9
  CursorMax = 20
  Fixed = TRUE
  MaxCand = 2
  MaxAttempts = 1
  RetryExhausted = TRUE
  CheckCursor = TRUE
  Rotate = TRUE
  CheckBlob = TRUE
  Uploads = {}
SPECIFICATION Spec
INVARIANTS AuthOnlyOnSuccess ShownIsAuthenticated NoSilentSkip CursorListed CursorValid CandsBounded
PROPERTIES AuthMonotone StatusLive
