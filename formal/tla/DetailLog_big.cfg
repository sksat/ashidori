  ScanAtFinal = TRUE
  GapScan = TRUE
  ReadBack = TRUE
  Unique = TRUE
  AtomicConsume = TRUE
  OnlyFrozen = TRUE
  GcLock = TRUE
  OneSnapshot = TRUE
