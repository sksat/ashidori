\* The code (with the fixes of the findings): liveness. Every attempt ends,
\* and the client ends ready (a key bound to its registration), refused, or
\* having given every token up; one cancel or unpairing, one failed write,
\* one crash or lost answer, one gate refusal. No sync runs (they only hold the lock).
CONSTANTS
  Tokens = {1, 2}
  MaxAttempts = 7
  MaxCancels = 1
  MaxWriteFail = 1
  MaxFaults = 1
  MaxRefusals = 1
  CanExpire = TRUE
  WithKey = TRUE
  WithRuns = FALSE
  LegacyKey = FALSE
  CancelSafe = TRUE
  TooLateNoop = TRUE
  Durable = TRUE
  StoreBeforeSend = TRUE
  KeyBound = TRUE
  UnpairMark = TRUE
  RunReadsOnce = TRUE
  UnknownMarkSet = TRUE
  ResumeAtStart = TRUE
SPECIFICATION Spec
PROPERTIES AttemptEnds Converges
