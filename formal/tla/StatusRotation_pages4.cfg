\* The code, two rows a page and two pages a run (one left to a due rescan):
\* the walk and the rescan span runs. A genuine status and 4 made-up rows of
\* one device, a server that fails the genuine status up to 3 times.
CONSTANTS
  Devs = {2}
  Listing <- MCL4
  PageSize = 2
  MaxPages = 2
  RescanPages = 1
  MaxRetries = 4
  MaxCand = 4
  MaxAttempts = 3
  MaxFaults = 3
  Gap = 2
  Week = 6
  Rotate = TRUE
  PassBound = 9
SPECIFICATION Spec
INVARIANTS AuthOnlyOnSuccess CandsBounded NoSilentSkip
PROPERTIES AuthMonotone StatusLive EveryListedTried
