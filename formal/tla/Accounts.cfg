\* The code. Three tokens race for MaxUsers = 2 places; a token's copies
\* may also race below the limit (UNIQUE rollback). The operator may close
\* registration; a gate may refuse once.
CONSTANTS
  Tokens = {1, 2, 3}
  ReqsPerToken = 2
  MaxUsers = 2
  OtherTok = 0
  MaxGateRefusals = 1
  CanClose = TRUE
  RecheckOnZero = TRUE
  RecoverFirst = TRUE
  RecheckClosed = TRUE
SPECIFICATION Spec
INVARIANTS OneDevicePerToken UsersUnderMax EveryUserHasItsDevice RetriesAgree RecoverUngated
