\* The code against a hostile server that lists a fake row with a huge seq and
\* one with a huge cursor (they stay listed), and serves other blobs or 404 a
\* bounded number of times: safety and liveness hold (review #7). Two devices
\* (self and one other) keep the state space small.
CONSTANTS
  Devs = {1, 2}
  Self = 1
  MaxRows = 3
  Limit = 1
  MaxNetErr = 1
  Hostile = TRUE
  FakeKinds = {"seq", "cursor"}
  BigSeq = 9
  BigCursor = 9
  Fixed = TRUE
  MaxCand = 2
SPECIFICATION Spec
INVARIANTS AuthOnlyOnSuccess ShownIsAuthenticated NoSilentSkip CursorListed CandsBounded
PROPERTIES AuthMonotone StatusLive
