\* Liveness: once failures stop, every dead or closed journal is recovered,
\* finalised and deleted (weak fairness of the finaliser; 2 samples).
CONSTANTS
  N = 2
  DayBreak = 2
  NJ = 2
  MaxGen = 2
  MaxCrash = 1
  CreateSync = TRUE
  FileFsync = TRUE
  DirFsync = TRUE
  LedgerFull = TRUE
  LedgerFirst = TRUE
  ParentManifest = TRUE
  LossFirst = TRUE
  ScanAtFinal = TRUE
  GapScan = TRUE
  ReadBack = TRUE
  Unique = TRUE
  AtomicConsume = TRUE
  OnlyFrozen = TRUE
  GcLock = TRUE
  OneSnapshot = TRUE
SPECIFICATION LiveSpec
PROPERTY JournalsResolved
