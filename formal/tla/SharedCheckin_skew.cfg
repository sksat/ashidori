\* Limit (expected to FAIL StaleMeansLaterOp): with clocks that differ between
\* devices, the user's later operation can carry a lower rev and gets "stale";
\* the earlier operation of the other device stays in effect.
CONSTANTS
  Devices = {1, 2}
  MaxRev = 3
  MaxOps = 3
  Contents = {"a", "b"}
  Fixed = TRUE
SPECIFICATION Spec
INVARIANTS StaleMeansLaterOp
