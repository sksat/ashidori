name: server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  # Runs only when the repository variable DEPLOY_SERVER is "true". The D1
  # database, R2 bucket, custom domain and Access application must already
  # exist (see server/README.md); this job only migrates and deploys.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_SERVER == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Set D1 database id
        run: |
          test -n "$D1_DATABASE_ID" || { echo "D1_DATABASE_ID is not set" >&2; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.jsonc

      - name: Migrate D1
        run: pnpm exec wrangler d1 migrations apply ashidori --remote

      - name: Deploy
        run: >-
          pnpm exec wrangler deploy
          --var "CF_ACCESS_TEAM_DOMAIN:${{ vars.CF_ACCESS_TEAM_DOMAIN }}"
          --var "CF_ACCESS_AUD:${{ vars.CF_ACCESS_AUD }}"
