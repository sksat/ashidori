\* The code (with the fixes of the two findings, see RegistrationClient.tla:
\* RunReadsOnce, UnknownMarkSet, WriteReadsBack):
\* one cancel or unpairing, one failed write, one crash or lost answer, one
\* gate refusal, an expiring code, the key step and sync runs. Safety.
CONSTANTS
  Tokens = {1, 2}
  MaxAttempts = 5
  MaxCancels = 1
  MaxWriteFail = 1
  MaxFaults = 1
  MaxRefusals = 1
  CanExpire = TRUE
  WithKey = TRUE
  WithRuns = TRUE
  LegacyKey = FALSE
  CancelSafe = TRUE
  TooLateNoop = TRUE
  Durable = TRUE
  StoreBeforeSend = TRUE
  KeyBound = TRUE
  UnpairMark = TRUE
  RunReadsOnce = TRUE
  UnknownMarkSet = TRUE
  WriteReadsBack = TRUE
  ResumeAtStart = TRUE
SPECIFICATION Spec
INVARIANTS ReadReturnsPersisted ReadyPersisted NoForeignKey RunRegMatches CancelledNoEffect FailureReported TokenRecoverable
