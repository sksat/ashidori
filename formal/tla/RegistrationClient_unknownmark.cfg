\* Finding (expected to FAIL TokenRecoverable; the code as it is): the unmark
\* write fails and cannot be read back, so the mark reads as absent while the
\* disk still holds it. A new registration begins; the next start resumes the
\* unpairing and removes its pending request, while the server created its device.
CONSTANTS
  Tokens = {1, 2}
  MaxAttempts = 4
  MaxCancels = 1
  MaxWriteFail = 1
  MaxFaults = 1
  MaxRefusals = 0
  CanExpire = TRUE
  WithKey = TRUE
  WithRuns = TRUE
  LegacyKey = FALSE
  CancelSafe = TRUE
  TooLateNoop = TRUE
  Durable = TRUE
  StoreBeforeSend = TRUE
  KeyBound = TRUE
  UnpairMark = TRUE
  RunReadsOnce = TRUE
  UnknownMarkSet = FALSE
  ResumeAtStart = TRUE
SPECIFICATION Spec
INVARIANTS TokenRecoverable
