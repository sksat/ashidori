\* Mutation (expected to FAIL RecoverUngated): the gates come before the
\* recovery (review 6 item 9), so a client whose response got lost can be
\* refused (429/503, or 403 once the operator closed registration).
CONSTANTS
  Tokens = {1, 2, 3}
  ReqsPerToken = 2
  MaxUsers = 2
  OtherTok = 0
  MaxGateRefusals = 1
  CanClose = TRUE
  RecheckOnZero = TRUE
  RecoverFirst = FALSE
  RecheckClosed = TRUE
SPECIFICATION Spec
INVARIANTS RecoverUngated
