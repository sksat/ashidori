\* Finding, fixed (expected to FAIL TokenRecoverable; the code BEFORE the
\* fix): the unmark write fails and cannot be read back, so the mark read as
\* absent while the disk still held it. A new registration began; the next
\* start resumed the unpairing and removed its pending request, while the
\* server created its device. (Also before the fix: a later write of other
\* keys wrote the old mark back, WriteReadsBack = FALSE.) The code now reads
\* an unknown mark as set, writes the unmark again, and starts a write after
\* an unreadable failure from the file (UnknownMarkSet = WriteReadsBack =
\* TRUE in RegistrationClient.cfg).
CONSTANTS
  Tokens = {1, 2}
  MaxAttempts = 4
  MaxCancels = 1
  MaxWriteFail = 1
  MaxFaults = 1
  MaxRefusals = 0
  CanExpire = TRUE
  WithKey = TRUE
  WithRuns = TRUE
  LegacyKey = FALSE
  CancelSafe = TRUE
  TooLateNoop = TRUE
  Durable = TRUE
  StoreBeforeSend = TRUE
  KeyBound = TRUE
  UnpairMark = TRUE
  RunReadsOnce = TRUE
  UnknownMarkSet = FALSE
  WriteReadsBack = FALSE
  ResumeAtStart = TRUE
SPECIFICATION Spec
INVARIANTS TokenRecoverable
