\* The code against a hostile server, with fake rows spread over two other
\* devices: a huge seq (device 2), the same seq as a genuine status with
\* another hash and a cursor out of the API's range (device 3). They stay
\* listed, except the out-of-range one, which the server eventually stops
\* listing. Safety and liveness hold (reviews #7, R4). Only statuses of the
\* other devices are uploaded here, to keep the state space small.
CONSTANTS
  Devs = {1, 2, 3}
  Self = 1
  MaxRows = 2
  Limit = 1
  MaxNetErr = 1
  Hostile = TRUE
  Fakes = {"s2", "x3", "b3"}
  BigSeq = 9
  BigCursor = 9
  CursorMax = 20
  Fixed = TRUE
  MaxCand = 2
  MaxAttempts = 3
  RetryExhausted = TRUE
  CheckCursor = TRUE
  Uploads = {}
SPECIFICATION Spec
INVARIANTS AuthOnlyOnSuccess ShownIsAuthenticated NoSilentSkip CursorListed CursorValid CandsBounded
PROPERTIES AuthMonotone StatusLive
