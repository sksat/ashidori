\* Finding, fixed (expected to FAIL RunRegMatches; the code BEFORE the fix):
\* SyncRun.current read the key, then the registration again; an unpairing
\* mark in between gave the run the key of A and the registration "" (its
\* sync state key). The code now reads them once (PairingStore.session,
\* RunReadsOnce = TRUE in RegistrationClient.cfg).
CONSTANTS
  Tokens = {1, 2}
  MaxAttempts = 4
  MaxCancels = 1
  MaxWriteFail = 1
  MaxFaults = 1
  MaxRefusals = 0
  CanExpire = TRUE
  WithKey = TRUE
  WithRuns = TRUE
  LegacyKey = FALSE
  CancelSafe = TRUE
  TooLateNoop = TRUE
  Durable = TRUE
  StoreBeforeSend = TRUE
  KeyBound = TRUE
  UnpairMark = TRUE
  RunReadsOnce = FALSE
  UnknownMarkSet = TRUE
  WriteReadsBack = TRUE
  ResumeAtStart = TRUE
SPECIFICATION Spec
INVARIANTS RunRegMatches
