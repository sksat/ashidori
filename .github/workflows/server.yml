name: server

# The server's and the web viewer's tests, and on main the deploy. Every pull
# request runs the tests, so that the required check "server" always reports;
# tools/ci/changes.sh skips their work when no server file changed. The deploy
# job never runs from a pull request (its "if").
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main are
# never cancelled (each has its own group; the deploy job has its own too).
concurrency:
  group: server-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  # The required check: one job, named "server", that decides by itself
  # whether the work is needed (a skipped job would count as passed).
  test:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        working-directory: .
        run: tools/ci/changes.sh server
      - uses: pnpm/action-setup@v6.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.run == 'true'
      # The web viewer (server/web): typecheck, build and its own tests. The
      # build comes first: the server's tests serve web/dist (wrangler.jsonc "assets").
      - name: Build web viewer
        if: steps.changes.outputs.run == 'true'
        run: pnpm --dir web build
      - name: Test web viewer
        if: steps.changes.outputs.run == 'true'
        run: pnpm --dir web test
      - run: pnpm exec tsc --noEmit
        if: steps.changes.outputs.run == 'true'
      - run: pnpm test
        if: steps.changes.outputs.run == 'true'
      # Validates the repository variables a deploy would pass, so that a
      # typo fails here, before anything is deployed. The values reach the
      # shell only as environment variables, never as interpolated code.
      - name: Check server variables
        if: steps.changes.outputs.run == 'true'
        env:
          REGISTRATION: ${{ vars.REGISTRATION }}
          USER_QUOTA_BYTES: ${{ vars.USER_QUOTA_BYTES }}
          USER_MAX_BATCHES: ${{ vars.USER_MAX_BATCHES }}
          USER_MAX_DEVICES: ${{ vars.USER_MAX_DEVICES }}
          USER_MAX_SHARED_CHECKINS: ${{ vars.USER_MAX_SHARED_CHECKINS }}
          MAX_USERS: ${{ vars.MAX_USERS }}
          MAX_TOTAL_BYTES: ${{ vars.MAX_TOTAL_BYTES }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: node scripts/check-config.ts

  # The formal models (formal/README.md) must pass on the same commit before a
  # deploy. Pull requests have their own "formal" check (formal.yml), so this
  # call is only for the deploy, and is named apart from that check.
  formal:
    name: formal before deploy
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/formal.yml

  # Runs only when the repository variable DEPLOY_SERVER is "true". The D1
  # database, R2 bucket, custom domain and Access application must already
  # exist (see server/README.md); this job only migrates and deploys.
  deploy:
    needs: [test, formal]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_SERVER == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Repository variables are passed through env and quoted in the shell
      # ("$VAR"), never interpolated into the script as an expression, so that a
      # value cannot inject shell code.
      - name: Check server variables
        env:
          REGISTRATION: ${{ vars.REGISTRATION }}
          USER_QUOTA_BYTES: ${{ vars.USER_QUOTA_BYTES }}
          USER_MAX_BATCHES: ${{ vars.USER_MAX_BATCHES }}
          USER_MAX_DEVICES: ${{ vars.USER_MAX_DEVICES }}
          USER_MAX_SHARED_CHECKINS: ${{ vars.USER_MAX_SHARED_CHECKINS }}
          MAX_USERS: ${{ vars.MAX_USERS }}
          MAX_TOTAL_BYTES: ${{ vars.MAX_TOTAL_BYTES }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: node scripts/check-config.ts

      # The viewer's files (web/dist), uploaded with the Worker as static
      # assets. Built before the migrations, so a failing build changes nothing.
      - name: Build web viewer
        run: pnpm --dir web build

      - name: Set D1 database id
        run: |
          test -n "$D1_DATABASE_ID" || { echo "D1_DATABASE_ID is not set" >&2; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.jsonc

      # Migrations run before the deploy, so the previous Worker keeps serving
      # on the new schema until the deploy completes (or after a failed deploy
      # or a rollback). Migrations must therefore accept that Worker's writes:
      # defaults for new NOT NULL columns, triggers for what it does not write
      # (see "マイグレーションと旧 Worker の同居" in server/README.md).
      - name: Migrate D1
        run: pnpm exec wrangler d1 migrations apply ashidori --remote

      - name: Deploy
        env:
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          REGISTRATION: ${{ vars.REGISTRATION }}
          USER_QUOTA_BYTES: ${{ vars.USER_QUOTA_BYTES }}
          USER_MAX_BATCHES: ${{ vars.USER_MAX_BATCHES }}
          USER_MAX_DEVICES: ${{ vars.USER_MAX_DEVICES }}
          USER_MAX_SHARED_CHECKINS: ${{ vars.USER_MAX_SHARED_CHECKINS }}
          MAX_USERS: ${{ vars.MAX_USERS }}
          MAX_TOTAL_BYTES: ${{ vars.MAX_TOTAL_BYTES }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          pnpm exec wrangler deploy \
            --var "CF_ACCESS_TEAM_DOMAIN:$CF_ACCESS_TEAM_DOMAIN" \
            --var "CF_ACCESS_AUD:$CF_ACCESS_AUD" \
            --var "ADMIN_EMAILS:$ADMIN_EMAILS" \
            --var "REGISTRATION:${REGISTRATION:-admin}" \
            --var "USER_QUOTA_BYTES:$USER_QUOTA_BYTES" \
            --var "USER_MAX_BATCHES:$USER_MAX_BATCHES" \
            --var "USER_MAX_DEVICES:$USER_MAX_DEVICES" \
            --var "USER_MAX_SHARED_CHECKINS:$USER_MAX_SHARED_CHECKINS" \
            --var "MAX_USERS:$MAX_USERS" \
            --var "MAX_TOTAL_BYTES:$MAX_TOTAL_BYTES" \
            --var "ANDROID_CERT_SHA256:$ANDROID_CERT_SHA256"
