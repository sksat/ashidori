\* Before the fix: no commit deadline. Expected to FAIL: an attempt delayed
\* between the R2 put and the D1 commit beyond Grace loses its object to the sweep.
CONSTANTS
  Devs = {1, 2, 3}
  Users = {1, 2}
  Owner <- MCOwner
  Seqs = {0}
  Shas = {1, 2}
  Size <- MCSize
  Attempts = {1, 2}
  Quota = 2
  MaxBatches = 1
  MaxTotal = 3
  Grace = 2
  MaxTime = 4
SPECIFICATION Spec
INVARIANTS CommittedHasObject SweepSafe OneRowPerSlot CountersMatch UnderCaps
CONSTANTS
  Deadline = FALSE
  CommitDeadline = 0
  CountTrigger = TRUE
  CheckCaps = TRUE
