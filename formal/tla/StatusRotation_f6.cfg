\* Review F6, the code: a genuine seq 0 and made-up seqs 1..8 of one device
\* on one page, MaxCand = 4 (as in the app), a rescan as often as every
\* third run (adversarial), one fault. The rotation reads seq 0, and every
\* listed row is tried.
CONSTANTS
  Devs = {2}
  Listing <- MCL8
  PageSize = 10
  MaxPages = 20
  RescanPages = 5
  MaxRetries = 4
  MaxCand = 4
  MaxAttempts = 3
  MaxFaults = 1
  Gap = 1
  Week = 3
  Rotate = TRUE
  PassBound = 9
SPECIFICATION Spec
INVARIANTS AuthOnlyOnSuccess CandsBounded NoSilentSkip
PROPERTIES AuthMonotone StatusLive EveryListedTried
