\* The proposed protocol: 3 samples (2 of day 1, 1 of day 2) in 2 series, 2 journals,
\* 2 generations of day 1, one reader, one failure of any kind (or one dropped sample).
CONSTANTS
  N = 3
  DayBreak = 2
  NJ = 2
  MaxGen = 2
  MaxCrash = 1
  CreateSync = TRUE
  FileFsync = TRUE
  DirFsync = TRUE
  LedgerFull = TRUE
  LedgerFirst = TRUE
  ParentManifest = TRUE
  LossFirst = TRUE
  ScanAtFinal = TRUE
  GapScan = TRUE
  ReadBack = TRUE
  Unique = TRUE
  AtomicConsume = TRUE
  OnlyFrozen = TRUE
  GcLock = TRUE
  OneSnapshot = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK Durability NoDup LossReported LossOnlyUnsaved ReaderOK
