\* The code, two other devices, each with a genuine status and 5 made-up
\* rows, three rows a page and three pages a run, and one retry per run
\* shared by both devices; the server fails the genuine statuses up to twice.
CONSTANTS
  Devs = {2, 3}
  Listing <- MCL55
  PageSize = 3
  MaxPages = 3
  RescanPages = 1
  MaxRetries = 1
  MaxCand = 4
  MaxAttempts = 3
  MaxFaults = 2
  Gap = 2
  Week = 6
  Rotate = TRUE
  PassBound = 9
SPECIFICATION Spec
INVARIANTS AuthOnlyOnSuccess CandsBounded NoSilentSkip
PROPERTIES AuthMonotone StatusLive EveryListedTried
