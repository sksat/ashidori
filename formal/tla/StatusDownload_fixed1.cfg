\* The code against a hostile server, one other device: fake rows with a huge
\* seq, the same seq as a genuine status (another hash) and a cursor out of
\* the API's range, and other blobs or 404 up to 3 times. Safety and
\* liveness hold (reviews #7, R4, R5).
CONSTANTS
  Devs = {1, 2}
  Self = 1
  MaxRows = 2
  Limit = 1
  MaxNetErr = 3
  Hostile = TRUE
  Fakes = {"s2", "x2", "b2"}
  BigSeq = 9
  BigCursor = 9
  CursorMax = 20
  Fixed = TRUE
  MaxCand = 2
  MaxAttempts = 3
  RetryExhausted = TRUE
  CheckCursor = TRUE
  Uploads = {}
SPECIFICATION Spec
INVARIANTS AuthOnlyOnSuccess ShownIsAuthenticated NoSilentSkip CursorListed CursorValid CandsBounded
PROPERTIES AuthMonotone StatusLive
