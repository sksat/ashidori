\* Mutation (expected to FAIL TokenRecoverable): the request goes out before
\* its token is on disk (apply(), review N2); a crash loses the token.
CONSTANTS
  Tokens = {1, 2}
  MaxAttempts = 4
  MaxCancels = 1
  MaxWriteFail = 1
  MaxFaults = 1
  MaxRefusals = 0
  CanExpire = TRUE
  WithKey = TRUE
  WithRuns = TRUE
  LegacyKey = FALSE
  CancelSafe = TRUE
  TooLateNoop = TRUE
  Durable = TRUE
  StoreBeforeSend = FALSE
  KeyBound = TRUE
  UnpairMark = TRUE
  RunReadsOnce = TRUE
  UnknownMarkSet = TRUE
  WriteReadsBack = TRUE
  ResumeAtStart = TRUE
SPECIFICATION Spec
INVARIANTS TokenRecoverable
