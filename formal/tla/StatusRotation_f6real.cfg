\* Review F6, the code, with the app's intervals (one run an hour; a wanted
\* rescan a day after the previous one, else weekly) and a server that fails
\* the genuine status 3 times: seq 0 is read within 4 rescans (2 without
\* the failures).
CONSTANTS
  Devs = {2}
  Listing <- MCL8
  PageSize = 10
  MaxPages = 20
  RescanPages = 5
  MaxRetries = 4
  MaxCand = 4
  MaxAttempts = 3
  MaxFaults = 3
  Gap = 24
  Week = 168
  Rotate = TRUE
  PassBound = 4
SPECIFICATION Spec
INVARIANTS AuthOnlyOnSuccess CandsBounded NoSilentSkip ReadWithinPasses
PROPERTIES AuthMonotone StatusLive EveryListedTried
