\* As StatusRotation_pages4, with 5 made-up rows: one more than the
\* candidates kept per device, so the rotation is needed.
CONSTANTS
  Devs = {2}
  Listing <- MCL5
  PageSize = 2
  MaxPages = 2
  RescanPages = 1
  MaxRetries = 4
  MaxCand = 4
  MaxAttempts = 3
  MaxFaults = 3
  Gap = 2
  Week = 6
  Rotate = TRUE
  PassBound = 9
SPECIFICATION Spec
INVARIANTS AuthOnlyOnSuccess CandsBounded NoSilentSkip
PROPERTIES AuthMonotone StatusLive EveryListedTried
