\* Mutation (expected to FAIL FailureReported): before the fix of F2, a cancel
\* that came too late still invalidated the attempt, so its failed save was not shown.
CONSTANTS
  Tokens = {1, 2}
  MaxAttempts = 4
  MaxCancels = 1
  MaxWriteFail = 1
  MaxFaults = 1
  MaxRefusals = 0
  CanExpire = TRUE
  WithKey = TRUE
  WithRuns = TRUE
  LegacyKey = FALSE
  CancelSafe = TRUE
  TooLateNoop = FALSE
  Durable = TRUE
  StoreBeforeSend = TRUE
  KeyBound = TRUE
  UnpairMark = TRUE
  RunReadsOnce = TRUE
  UnknownMarkSet = TRUE
  ResumeAtStart = TRUE
SPECIFICATION Spec
INVARIANTS FailureReported
